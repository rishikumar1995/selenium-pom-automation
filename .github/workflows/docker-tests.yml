name: Selenium Tests - Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t selenium-pom:test .

      - name: Run Selenium tests
        run: docker run --rm selenium-pom:test pytest --browser=chrome --env=qa